services:
  linkpagosapi:
    image: mi-api-linkpago
    build:
      context: ./linkpagosapi
      dockerfile: Dockerfile
    container_name: linkpagosapi-container
    restart: unless-stopped
    ports:
      - "5159:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORTS: ""